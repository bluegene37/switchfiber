name: CI Quality Gate

# Gene - Oct, 06, 2026: Deprecated restricted main-only trigger to enable automated CI runs across all branches and pull requests
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
#   workflow_dispatch:

# Gene - Oct, 06, 2026: Auto-run CI Quality Gate on push to any branch and all pull requests
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  validate:
    # One job is enough: the app builds to static files, so the OS the build
    # runs on does not change what browsers receive. Node 22 matches the
    # release pipeline.
    name: Build & Test (Node 22.x on ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Static Code Analysis & Quality Linter
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Production Web Bundle
        run: npm run build

      - name: Upload Production Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchfiber-dist
          path: dist/
          retention-days: 14
