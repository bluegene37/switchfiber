name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Quality Verification Gates
        run: |
          npm run lint
          npm test

      - name: Build Production Web Bundle
        run: npm run build

      - name: Package Release Archives & Checksums
        run: npm run release:pack

      - name: Generate Release Notes & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
