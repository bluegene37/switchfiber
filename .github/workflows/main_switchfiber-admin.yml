# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - switchfiber-admin

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # - name: Set up Node.js version
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '24.x'
      #
      # - name: npm install, build, and test
      #   run: |
      #     npm install
      #     npm run build --if-present
      #     npm run test --if-present
      #
      # - name: Upload artifact for deployment job
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: node-app
      #     path: .

      # Gene - Nov, 21, 2026: Build SwitchFiber Admin for Azure root path with same-origin /api proxy and stage lightweight runtime bundle
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: npm ci, lint, test, and build
        env:
          VITE_BASE_PATH: '/'
          VITE_API_BASE_URL: '/api'
          VITE_API_URL: 'https://admin.switchfiber.ph'
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Stage lightweight deployment bundle
        run: |
          mkdir -p azure-deploy
          cp -r dist server.js package.json azure-deploy/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: azure-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E16955E284CB42B483FDBE973C08A1CE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2E891A91C3524130AF646843983A9211 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A89683CBCFAA4DF0820D94A04933C31F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'switchfiber-admin'
          slot-name: 'Production'
          package: .
