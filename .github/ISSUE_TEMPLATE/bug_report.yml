name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in SwitchFiber Admin
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.

  - type: input
    id: version
    attributes:
      label: SwitchFiber Version
      description: What version of SwitchFiber Admin are you using? (e.g. v1.0.0 or commit SHA)
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser & Operating System
      description: What browser and operating system were you using when the issue occurred?
      options:
        - Google Chrome (macOS)
        - Google Chrome (Windows)
        - Google Chrome (Linux)
        - Safari (macOS / iOS)
        - Mozilla Firefox (All OS)
        - Microsoft Edge (Windows / macOS)
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '/application'
        2. Click on 'Create Application'
        3. Fill in required fields and submit
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually occurred?
      placeholder: Expected the record to be created, but received a 400 Bad Request...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Console Logs / Network Payloads
      description: Please copy and paste any browser console errors or network request details.
      render: shell
